[package]
name         = "sovereign-quant"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
description  = "Quant models: Markov chains, regime-switching Monte Carlo (SIMD), Gaussian HMM."

[features]
default = ["simd"]
# `simd` selects the `wide`-based vectorized Monte-Carlo kernel. Turning it off
# falls back to the scalar kernel (used as the proptest oracle).
simd = []

[dependencies]
sovereign-core = { workspace = true }
ndarray        = { workspace = true }
nalgebra       = { workspace = true }
rand           = { workspace = true }
rand_distr     = { workspace = true }
wide           = { workspace = true }
tracing        = { workspace = true }
serde          = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "montecarlo"
harness = false
